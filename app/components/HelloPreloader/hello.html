    /* visible stroke (writing) */
    .stroke {
      stroke:#000;
      stroke-width:9;
      stroke-linecap:round;
      stroke-linejoin:round;
      fill:none;
    }
    /* eraser stroke: same path but background color and slightly thicker to fully cover */
    .eraser {
      stroke:#ffffff;            /* match page background */
      stroke-width:12;          /* a bit larger so it covers the black stroke cleanly */
      stroke-linecap:round;
      stroke-linejoin:round;

<script>
  const visible = document.getElementById('visible');
  const eraser  = document.getElementById('eraser');

  const len = visible.getTotalLength();

  // initial states
  gsap.set(visible,  { strokeDasharray: len, strokeDashoffset: len });
  gsap.set(eraser,   { strokeDasharray: len, strokeDashoffset: len, opacity: 1 });

  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.8 });

  // 1) draw visible stroke (writer)
  tl.to(visible, {
    duration: 3.6,
    strokeDashoffset: 0,
    ease: "power2.inOut"
  });

  // 2) hold a little
  tl.to({}, { duration: 0.6 }); // empty tween as hold

  // 3) animate eraser drawing forward from the start (covers visible stroke)
  tl.to(eraser, {
    duration: 3.6,
    strokeDashoffset: 0,    // eraser goes from hidden -> visible forward (start -> end)
    ease: "power2.inOut",
  }, "+=0");

  // 4) reset quickly for next loop:
  tl.set([visible, eraser], { strokeDasharray: len, strokeDashoffset: len }, "+=0.15");
</script>
